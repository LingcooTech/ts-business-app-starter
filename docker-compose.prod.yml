x-runtime-environment: &runtime-environment
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-ts-business-app-starter}
  APP_VERSION: ${APP_VERSION:-development}
  API_HOST: 0.0.0.0
  API_PORT: 8090
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
  AUTH_ACTION_TOKEN_TTL_SECONDS: ${AUTH_ACTION_TOKEN_TTL_SECONDS:-3600}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-__Host-app_session}
  AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-__Host-app_csrf}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_EXPOSE_TEST_TOKENS: ${AUTH_EXPOSE_TEST_TOKENS:-false}
  SETTINGS_ENCRYPTION_CURRENT_KEY_ID: ${SETTINGS_ENCRYPTION_CURRENT_KEY_ID:?SETTINGS_ENCRYPTION_CURRENT_KEY_ID is required}
  SETTINGS_ENCRYPTION_KEYS: ${SETTINGS_ENCRYPTION_KEYS:?SETTINGS_ENCRYPTION_KEYS is required}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-500}
  JOB_BATCH_SIZE: ${JOB_BATCH_SIZE:-20}
  JOB_LOCK_TIMEOUT_SECONDS: ${JOB_LOCK_TIMEOUT_SECONDS:-60}
  JOB_HEARTBEAT_INTERVAL_MS: ${JOB_HEARTBEAT_INTERVAL_MS:-10000}
  JOB_BACKOFF_BASE_MS: ${JOB_BACKOFF_BASE_MS:-1000}
  JOB_BACKOFF_MAX_MS: ${JOB_BACKOFF_MAX_MS:-300000}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/storage}
  STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-25000000}
  STORAGE_UPLOAD_EXPIRY_SECONDS: ${STORAGE_UPLOAD_EXPIRY_SECONDS:-900}
  STORAGE_ACCESS_EXPIRY_SECONDS: ${STORAGE_ACCESS_EXPIRY_SECONDS:-900}
  STORAGE_ALLOWED_MIME_TYPES: ${STORAGE_ALLOWED_MIME_TYPES:-image/*,application/pdf,text/plain}
  STORAGE_ALLOWED_PREFIXES: ${STORAGE_ALLOWED_PREFIXES:-media,documents,avatars}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
  STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-alipay}
  PAYMENT_NOTIFY_BASE_URL: ${PAYMENT_NOTIFY_BASE_URL:-http://localhost:18093}
  PAYMENT_CALLBACK_TOLERANCE_SECONDS: ${PAYMENT_CALLBACK_TOLERANCE_SECONDS:-300}
  PAYMENT_ALIPAY_APP_ID: ${PAYMENT_ALIPAY_APP_ID:-}
  PAYMENT_ALIPAY_PRIVATE_KEY: ${PAYMENT_ALIPAY_PRIVATE_KEY:-}
  PAYMENT_ALIPAY_PUBLIC_KEY: ${PAYMENT_ALIPAY_PUBLIC_KEY:-}
  PAYMENT_ALIPAY_GATEWAY: ${PAYMENT_ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
  PAYMENT_ALIPAY_RETURN_URL: ${PAYMENT_ALIPAY_RETURN_URL:-}
  PAYMENT_WECHAT_MCH_ID: ${PAYMENT_WECHAT_MCH_ID:-}
  PAYMENT_WECHAT_APP_ID: ${PAYMENT_WECHAT_APP_ID:-}
  PAYMENT_WECHAT_MERCHANT_SERIAL: ${PAYMENT_WECHAT_MERCHANT_SERIAL:-}
  PAYMENT_WECHAT_PRIVATE_KEY: ${PAYMENT_WECHAT_PRIVATE_KEY:-}
  PAYMENT_WECHAT_PLATFORM_CERTIFICATES: ${PAYMENT_WECHAT_PLATFORM_CERTIFICATES:-}
  PAYMENT_WECHAT_API_V3_KEY: ${PAYMENT_WECHAT_API_V3_KEY:-}
  BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
  BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment: *runtime-environment
    command: ['node', 'server/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8090'
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    environment: *runtime-environment
    command: ['node', 'server/dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "process.exit(require('fs').readFileSync('/proc/1/cmdline','utf8').includes('worker.js') ? 0 : 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS is required}
    ports:
      - '${HTTP_PORT:?HTTP_PORT is required}:80'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
